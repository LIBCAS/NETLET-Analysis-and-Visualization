<div class="app-loading">
  @if (loading && !running) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
</div>

<as-split
  class="app-analysis-layout"
  direction="horizontal"
  [unit]="'pixel'"
  (gutterClick)="state.gutterClick($event)">
  <as-split-area class="app-analysis-facets" [size]="state.facetsSize">
    <div class="app-filters">
      <app-facets
        [fields]="['authors', 'recipients', 'mentioned', 'keyword_categories', 'keywords', 'professions', 'origins', 'destinations', 'languages']"
        [sub_fields]="{'keyword_categories': 'keywords'}"
        [facets]="facets()"
        (onFiltersChanged)="onFiltersChanged($event)"
        (onMouserOver)="showNode($event)"
        (onMouseOut)="hideNode()">
      </app-facets>
    </div>
  </as-split-area>

  <as-split-area class="app-analysis-results">
    <div class="app-view-content app-analysis-content">
      <nav class="app-view-breadcrumbs" [attr.aria-label]="'timeline.breadcrumbs' | translate">
        <ol>
          <li>
            <a routerLink="/" queryParamsHandling="preserve">{{ 'navbar.search' | translate }}</a>
          </li>
          <li aria-current="page">
            <mat-icon aria-hidden="true">chevron_right</mat-icon>
            {{ 'home.identities.header' | translate }}
          </li>
        </ol>
      </nav>

      <header class="app-view-header app-view-card">
        <p>{{ 'home.identities.header' | translate }}</p>
        <h1>{{ 'identities.title' | translate }}</h1>
        <div>{{ 'home.identities.text' | translate }}</div>
      </header>

      <div class="app-view-network-workspace app-analysis-workspace app-analysis-graph">
        <section class="app-view-card app-view-chart" [attr.aria-label]="'map.year_chart' | translate">
          <div class="app-years">
            @if (solrResponse?.facets.years) {
              <app-years-chart
                [dateYearFacet]="solrResponse.facets.years"
                [withAnimation]="false"
                [redesignedControls]="true"
                (onChangeLimits)="changeLimits($event)"
                (onChangeRunning)="changeRunning($event)">
              </app-years-chart>
            }
          </div>
        </section>

        <section
          class="app-view-network app-view-card app-view-card-clip app-analysis-graph-body"
          [attr.aria-label]="'identities.title' | translate">
          <div
            echarts
            class="app-analysis-graph-fill"
            [options]="graphOptions"
            (chartInit)="onGraphChartInit($event)">
          </div>
        </section>
      </div>
    </div>
  </as-split-area>
</as-split>

<div class="app-loading">@if(loading()){<mat-progress-bar mode="indeterminate"></mat-progress-bar>}</div>
<as-split direction="horizontal" [unit]="'pixel'" (gutterClick)="state.gutterClick($event)">
  <as-split-area [size]="state.facetsSize" >
    <div style="flex: 1 30%;" class="app-filters">
       @if(facets()) {
        <app-facets
        [fields]="['authors', 'recipients', 'mentioned', 'identities', 'keyword_categories', 'keywords', 'professions', 'origins', 'destinations', 'languages']"
        [renderLists]="true"
        [facets]="facets()" (onFiltersChanged)="onFiltersChanged($event)"></app-facets> }
    </div>
  </as-split-area>
  <as-split-area>
    <div class="app-content app-fill-w app-fill-h">
      <div echarts [class.app-loading-identity]="loading()" style="height: 100%; width: 100%;"
                [initOpts]="{ locale: 'CZ' }" [options]="yearsChartOptions"
                (chartInit)="onYearsChartInit($event)">
            </div>
      
</div>
  </as-split-area>
</as-split>

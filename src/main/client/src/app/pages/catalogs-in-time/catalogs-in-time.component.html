<div class="app-loading">
  @if(loading()){
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
</div>
<as-split class="app-analysis-layout" direction="horizontal" [unit]="'pixel'" (gutterClick)="state.gutterClick($event)">
  <as-split-area class="app-analysis-facets" [size]="state.facetsSize">
    <div class="app-filters">
      @if(facets()) {
        <app-facets
          [fields]="['authors', 'recipients', 'mentioned', 'identities', 'keyword_categories', 'keywords', 'professions', 'origins', 'destinations', 'languages']"
          [renderLists]="true"
          [facets]="facets()"
          (onFiltersChanged)="onFiltersChanged($event)"></app-facets>
      }
    </div>
  </as-split-area>
  <as-split-area class="app-analysis-results">
    <div class="app-content app-analysis-content">
      <div class="app-analysis-workspace app-analysis-graph">
        <div
          echarts
          class="app-analysis-graph-fill"
          [class.app-loading-identity]="loading()"
          [initOpts]="{ locale: 'CZ' }"
          [options]="yearsChartOptions"
          (chartInit)="onYearsChartInit($event)"></div>
      </div>
    </div>
  </as-split-area>
</as-split>

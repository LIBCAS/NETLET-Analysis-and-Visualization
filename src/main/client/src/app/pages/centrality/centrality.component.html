<div class="app-loading">
  @if(loading && !running){
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
</div>
<as-split class="app-analysis-layout" direction="horizontal" [unit]="'pixel'" (gutterClick)="state.gutterClick($event)">
  <as-split-area class="app-analysis-facets" [size]="state.facetsSize">
    <div class="app-filters">
      <app-facets
        [fields]="['authors', 'recipients', 'mentioned', 'keyword_categories', 'keywords', 'professions', 'origins', 'destinations', 'languages']"
        [sub_fields]="{'keyword_categories': 'keywords'}"
        [facets]="facets()"
        (onFiltersChanged)="onFiltersChanged($event)"
        (onMouserOver)="showNodeExt($event)"
        (onMouseOut)="hideNode()"></app-facets>
    </div>
  </as-split-area>
  <as-split-area class="app-analysis-results">
    <div class="app-content app-analysis-content">
      <div class="app-analysis-workspace app-analysis-graph">
        <div class="app-years">
          @if (solrResponse?.facets.years) {
            <app-years-chart
              [dateYearFacet]="solrResponse.facets.years"
              (onChangeLimits)="changeLimits($event)"
              [withAnimation]="false"
              (onChangeRunning)="changeRunning($event)"></app-years-chart>
          }
        </div>
        <div>
          <mat-checkbox [(ngModel)]="allIncluded" (click)="processResponse()" [title]="config.excluded_identities()">
            Včetně hlavních aktérů
          </mat-checkbox>
          <mat-checkbox [(ngModel)]="showOverlap" (click)="toggleOverlap()">Zobrazit všechna jména</mat-checkbox>
        </div>
        <div class="app-analysis-graph-body">
          <div class="app-analysis-graph-fill">
            <div
              echarts
              class="app-analysis-graph-fill"
              [options]="graphOptions"
              (chartInit)="onGraphChartInit($event)"></div>
          </div>
        </div>
      </div>
    </div>
  </as-split-area>
</as-split>
@if (infoHeader) {
  <div class="app-letters-info">
    <app-letters-info
      [header]="infoHeader"
      [content]="infoContent"
      [fields]="infoFields"
      [data]="infoData"
      (onClose)="closeInfo()"></app-letters-info>
  </div>
}

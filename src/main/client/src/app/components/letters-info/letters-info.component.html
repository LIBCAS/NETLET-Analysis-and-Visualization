<mat-card class="mat-mdc-elevation-specific mat-elevation-z3">
    <mat-card-header>
        <mat-card-title>{{ computedHeader() }}</mat-card-title>
        @if(type() ==='link') {
        <button mat-icon-button (click)="swapLink()"><mat-icon>swap_horiz</mat-icon></button>
        }
        @if(type() ==='place') {
        <mat-checkbox [(ngModel)]="showFrom" (click)="filter()">from</mat-checkbox>
        <mat-checkbox [(ngModel)]="showTo" (click)="filter()">to</mat-checkbox>
        }
    </mat-card-header>
    <mat-card-content class="app-info-content">
        <div [innerHtml]="content()" class="app-info-row"></div>
        <app-letters-table [letters]="filteredData()" [displayedColumns]="fields()" [target]="'_blank'"></app-letters-table>
    </mat-card-content>
    <mat-card-actions align="end" class="app-mat-card-actions">
        <button mat-raised-button (click)="close()">{{ 'action.Close' | translate }}</button>
    </mat-card-actions>
</mat-card>
